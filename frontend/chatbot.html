<div id="chat-widget-button" onclick="toggleChat()" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background-color: #2D8CFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
</div>

<div id="chat-window" style="display: none; position: fixed; bottom: 90px; right: 20px; width: 380px; height: 600px; background-color: #1A1A1A; border-radius: 15px; flex-direction: column; box-shadow: 0 8px 25px rgba(0,0,0,0.5); overflow: hidden; z-index: 1000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    
    <div style="background: linear-gradient(90deg, #2D8CFF 0%, #AA80FF 100%); padding: 20px; color: white; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <h3 style="margin: 0; font-size: 1.2em;">Michele</h3>
            <span style="font-size: 0.8em; opacity: 0.9;">En ligne</span>
        </div>
        <button onclick="toggleChat()" style="background: transparent; border: none; color: white; font-size: 20px; cursor: pointer;">&times;</button>
    </div>

    <div id="messages" style="flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #1A1A1A;">
        <div style="align-self: flex-start; background-color: #333; color: white; padding: 12px 16px; border-radius: 15px 15px 15px 2px; max-width: 80%; font-size: 0.95em;">
            Bonjour je suis Michele ! Comment puis-je vous aider aujourd'hui ?
        </div>
    </div>

    <div style="padding: 20px; background-color: #1A1A1A; border-top: 1px solid #333;">
        <div style="background-color: #2A2A2A; border-radius: 12px; padding: 10px; display: flex; align-items: center;">
            <input type="text" id="chat-input" placeholder="Écrire un message..." style="flex: 1; background: transparent; border: none; color: white; outline: none; padding: 5px 10px;">
            <button onclick="sendMessage()" style="background: #333; border: none; border-radius: 50%; width: 35px; height: 35px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <p style="color: #666; font-size: 0.7em; text-align: center; margin-top: 10px;">UTexchange 2026 - Assistant Virtuel</p>
    </div>
</div>

<script src="/frontend/js/chat.js"></script>

<script>
function toggleChat() {
    const win = document.getElementById('chat-window');
    win.style.display = (win.style.display === 'none' || win.style.display === '') ? 'flex' : 'none';
}
</script>
