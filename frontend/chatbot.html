<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Test</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
    }

    #chatbox {
      width: 350px;
      margin: 50px auto;
      border: 1px solid #ccc;
      background: white;
      border-radius: 10px;
      padding: 10px;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
      margin-bottom: 10px;
    }

    .message {
      margin: 5px;
      padding: 8px;
      border-radius: 8px;
    }

    .user {
      background: #d1e7dd;
      text-align: right;
    }

    .bot {
      background: #e2e3e5;
      text-align: left;
    }

    #input {
      width: 75%;
      padding: 5px;
    }

    button {
      padding: 5px;
    }
  </style>
</head>
<body>

<div id="chatbox">
  <div id="messages"></div>

  <input id="input" placeholder="Écris un message..." />
  <button onclick="sendMessage()">Envoyer</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  const userText = input.value;
  if (!userText) return;

  // Afficher message utilisateur
  messages.innerHTML += `<div class="message user">${userText}</div>`;

  input.value = "";

  // Appel API Flask
  const res = await fetch("http://127.0.0.1:5000/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: userText })
  });

  const data = await res.json();

  // Afficher réponse bot
  messages.innerHTML += `<div class="message bot">${data.response}</div>`;

  // Scroll auto
  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
